---
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    # Matches minimumReleaseAge in pnpm-workspace.yaml (10080 minutes). Security
    # updates ignore both, so their PRs can still fail CI on a young transitive.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
